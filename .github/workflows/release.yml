name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect merged release branch
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      version: ${{ steps.release.outputs.version }}
      pull-request: ${{ steps.release.outputs.pull-request }}
    steps:
      - name: Resolve the merged release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_request="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main" and (.head.ref | startswith("release/")))] | first')"
          branch="$(printf '%s' "$pull_request" | jq -r '.head.ref // empty')"
          number="$(printf '%s' "$pull_request" | jq -r '.number // empty')"
          if [ -z "$branch" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No merged release/* pull request targets this main commit."
            exit 0
          fi
          version="${branch#release/}"
          version="${version#v}"
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release branch '$branch' must end in a semantic version." >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pull-request=$number" >> "$GITHUB_OUTPUT"
          echo "Release $version resolved from PR #$number ($branch)."

  live-contract:
    name: Full live SDK contract
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    uses: ./.github/workflows/contract.yml
    secrets: inherit

  validate:
    name: Validate release candidate
    needs:
      - prepare
      - live-contract
    if: needs.prepare.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up PHP with Xdebug
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.2"
          coverage: xdebug
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit locked dependencies
        run: composer audit --locked --no-interaction
      - name: Validate version, branch, changelog, and notes
        run: php tools/check-release-version.php "$RELEASE_VERSION"
      - name: Run authoritative quality and contract gates
        run: composer check
      - name: Generate and enforce fresh coverage
        run: |
          composer test:coverage
          php tools/check-coverage.php build/coverage/summary.txt 100
        env:
          XDEBUG_MODE: coverage
      - name: Build and inspect source archive
        run: |
          mkdir -p build/dist
          git archive --format=tar.gz --prefix="fleetbase-php-$RELEASE_VERSION/" --output="build/dist/fleetbase-php-$RELEASE_VERSION.tar.gz" HEAD
          php tools/check-release-archive.php "build/dist/fleetbase-php-$RELEASE_VERSION.tar.gz"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: build/dist/fleetbase-php-${{ needs.prepare.outputs.version }}.sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false
      - name: Generate checksums and collect evidence
        run: |
          cp build/coverage/summary.txt build/dist/coverage-summary.txt
          cp docs/api-coverage.md build/dist/api-coverage.md
          cd build/dist
          sha256sum fleetbase-php-* > SHA256SUMS
      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleetbase-php-${{ needs.prepare.outputs.version }}-release-candidate
          path: build/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved release
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleetbase-php-${{ needs.prepare.outputs.version }}-release-candidate
          path: build/dist
      - name: Recheck release identity
        run: php tools/check-release-version.php "$RELEASE_VERSION"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/dist/*
      - name: Create immutable tag and GitHub Release
        run: |
          gh release create "$RELEASE_VERSION" build/dist/* \
            --target "$GITHUB_SHA" \
            --title "Fleetbase PHP SDK $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md"

  verify-package:
    name: Verify published Packagist install
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # 2.36.0
        with:
          php-version: "8.2"
          coverage: none
          tools: composer:v2
      - name: Wait for Packagist and install the exact release
        run: |
          mkdir -p build/packagist-consumer
          composer init --working-dir=build/packagist-consumer --name=fleetbase/release-verifier --no-interaction
          for attempt in $(seq 1 20); do
            if composer show fleetbase/fleetbase-php "$RELEASE_VERSION" --all --no-interaction >/dev/null 2>&1; then
              composer require --working-dir=build/packagist-consumer "fleetbase/fleetbase-php:$RELEASE_VERSION" --no-interaction --prefer-dist
              composer install --working-dir=build/packagist-consumer --no-interaction --no-dev --optimize-autoloader
              exit 0
            fi
            sleep 30
          done
          echo "Packagist did not expose fleetbase/fleetbase-php:$RELEASE_VERSION within 10 minutes." >&2
          exit 1
