name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a v prefix
        required: true
        type: string
      publish:
        description: Publish the tag and GitHub Release after approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUBLISH_RELEASE: ${{ inputs.publish }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up PHP with Xdebug
        uses: shivammathur/setup-php@db91e1a0e48e84637d325a7ee4d2677e146ceec4 # 2.36.0
        with:
          php-version: "8.2"
          coverage: xdebug
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate version, branch, changelog, and notes
        run: |
          if [ "$PUBLISH_RELEASE" = "true" ]; then
            php tools/check-release-version.php "$RELEASE_VERSION"
          else
            php tools/check-release-version.php "$RELEASE_VERSION" --allow-non-main
          fi
      - name: Run authoritative quality and contract gates
        run: composer check
      - name: Generate and enforce fresh coverage
        run: |
          composer test:coverage
          php tools/check-coverage.php build/coverage/summary.txt 100
        env:
          XDEBUG_MODE: coverage
      - name: Build and inspect source archive
        run: |
          mkdir -p build/dist
          git archive --format=tar.gz --prefix="fleetbase-php-$RELEASE_VERSION/" --output="build/dist/fleetbase-php-$RELEASE_VERSION.tar.gz" HEAD
          php tools/check-release-archive.php "build/dist/fleetbase-php-$RELEASE_VERSION.tar.gz"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: build/dist/fleetbase-php-${{ inputs.version }}.sbom.cdx.json
          upload-artifact: false
          dependency-snapshot: false
      - name: Generate checksums and collect evidence
        run: |
          cp build/coverage/summary.txt build/dist/coverage-summary.txt
          cp docs/api-coverage.md build/dist/api-coverage.md
          cd build/dist
          sha256sum fleetbase-php-* > SHA256SUMS
      - name: Upload release-candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleetbase-php-${{ inputs.version }}-release-candidate
          path: build/dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved release
    if: inputs.publish == true
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download validated release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleetbase-php-${{ inputs.version }}-release-candidate
          path: build/dist
      - name: Recheck release identity
        run: php tools/check-release-version.php "$RELEASE_VERSION"
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/dist/*
      - name: Create immutable tag and GitHub Release
        run: |
          gh release create "$RELEASE_VERSION" build/dist/* \
            --target "$GITHUB_SHA" \
            --title "Fleetbase PHP SDK $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md"
